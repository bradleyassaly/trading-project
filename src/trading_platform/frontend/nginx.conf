server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long cache for hashed static assets; Vite fingerprints them.
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|woff2?|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy API calls to the internal api service on port 8001.
    location /api/ {
        proxy_pass http://api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # SPA fallback: unknown paths → index.html for React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reasonable hardening defaults.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
