[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-platform"
version = "0.1.0"
description = "Research platform for trading strategies, feature engineering, and backtesting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
keywords = ["trading", "research", "backtesting", "portfolio", "monitoring"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
]

authors = [
  { name = "Brad Assaly" }
]

dependencies = [
  "pandas>=2.0",
  "numpy>=1.26",
  "polars>=0.20",
  "yfinance>=0.2",
  "backtesting>=0.3",
  "pyarrow>=14.0",
  "PyYAML>=6.0",
  "alpaca-py",
  "scipy",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "psycopg-pool>=3.2",
  "prometheus-client>=0.20",
  # Kalshi prediction markets
  "requests>=2.31",
  "websockets>=10.0",
  "cryptography>=41.0",
  # Trading GUI API
  "fastapi>=0.110",
  "uvicorn[standard]>=0.28",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "py-clob-client-v2>=1.0"
]

[project.urls]
Repository = "https://github.com/bradleyassaly/trading-project"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
classification = [
  "FinanceDatabase>=2.1,<2.2",
  "pandas<3"
]
research_diagnostics = [
  "alphalens-reloaded>=0.4",
  "quantstats>=0.0.62"
]
trade_ev_reliability = [
  "scikit-learn>=1.3"
]
portfolio_optimizers = [
  "PyPortfolioOpt>=1.5"
]
validation = [
  "vectorbt>=0.26"
]
dev = [
  "pytest>=8.0",
  "pytest-timeout>=2.3",
  "ruff>=0.4",
  "black>=24.0",
  "responses>=0.25"
]

[project.scripts]
trading-cli = "trading_platform.cli.__main__:main"

[tool.pytest.ini_options]
# Single source of pytest config. A pytest.ini used to sit alongside this
# and, because pytest reads ini options from exactly one file, it silently
# voided everything here ("WARNING: ignoring pytest config in
# pyproject.toml!"). Consequences while it existed:
#   * pythonpath was inert, so `trading_platform` resolved only via the
#     venv's editable .pth — which points at the PARENT checkout. Tests run
#     from a git worktree imported main's source, making a worktree's own
#     src/ edits invisible to its own test run.
#   * testpaths was inert, so a bare `pytest` (what CI runs) collected
#     scripts/test_signal_engine.py — 0 tests, but it load_dotenv()s the
#     real .env at import.
# Keep pytest config here only; do not reintroduce pytest.ini.
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning:websockets.*",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.black]
line-length = 120
