name: ci

on:
  push:
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The polymarket test suite was written against SQLite (each test
      # bootstraps a temp .db file and passes its path). The 2026-04-14
      # Postgres cutover changed the runtime default to postgres, which
      # made ~75 tests fail in CI with UndefinedTable/PoolTimeout —
      # they were still creating SQLite fixtures while get_connection()
      # routed to a database that didn't have their schema. Production
      # keeps DB_BACKEND=postgres; CI pins the backend the tests were
      # written for. (A bare postgres:16 service was tried first — it
      # fixes the timeouts but not the missing per-test schemas.)
      DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python -m pip check

      - name: Lint
        # E9/F63/F7/F82: syntax + undefined names (original set).
        # F811: silent redefinitions (shadowed functions/tests).
        # F823: local variable referenced before assignment.
        # Ruff runs on 3.12 here but the package declares >=3.10, so pin
        # target-version to the floor to catch 3.12-only syntax creeping in.
        run: python -m ruff check src tests --select E9,F63,F7,F82,F811,F823 --target-version py310

      - name: Test
        # Per-test timeout: a handful of tests make real network calls
        # that hang on runner IPs (Cloudflare). 90s converts a hang into
        # a visible failure instead of stalling the job to its 20-min
        # kill (which is what a bare `pytest` did on 2026-07-02).
        run: python -m pytest --timeout=90 --timeout-method=thread
