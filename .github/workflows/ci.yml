name: ci

on:
  push:
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The polymarket test suite was written against SQLite (each test
      # bootstraps a temp .db file and passes its path). The 2026-04-14
      # Postgres cutover made get_connection() Postgres-only, which broke
      # every such test in CI: UndefinedTable against a bare server, or
      # 60s pool waits where no server exists. get_connection() honors
      # DB_BACKEND=sqlite again as a test-only lane (production compose
      # sets nothing and stays on Postgres). A bare postgres:16 service
      # was tried first — it fixes timeouts but not the fixture schemas,
      # which live in the per-test SQLite files.
      DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python -m pip check

      - name: Lint
        # E9/F63/F7/F82: syntax + undefined names (original set).
        # F811: silent redefinitions (shadowed functions/tests).
        # F823: local variable referenced before assignment.
        # Ruff runs on 3.12 here but the package declares >=3.10, so pin
        # target-version to the floor to catch 3.12-only syntax creeping in.
        run: python -m ruff check src tests --select E9,F63,F7,F82,F811,F823 --target-version py310

      - name: Test
        # Per-test timeout: converts any hang into a visible failure
        # instead of stalling the job to its 20-min kill (which is what
        # a bare `pytest` did on 2026-07-02). Signal method (default) —
        # thread method os._exit()s the whole run at the first timeout,
        # discarding the summary.
        run: python -m pytest --timeout=90
