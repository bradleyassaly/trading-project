name: ci

on:
  push:
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # DB-backed tests default to postgres://polymarket@localhost:5432
      # (see db_connection.py). Without a service they hang on pool
      # timeouts and fail — this was one reason CI ran red for weeks.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: polymarket
          POSTGRES_PASSWORD: polymarket_dev
          POSTGRES_DB: polymarket
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polymarket"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Fail fast if the service is somehow unreachable instead of the
      # 60s-per-connection default that made failures look like hangs.
      PG_POOL_TIMEOUT: "10"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python -m pip check

      - name: Lint
        # E9/F63/F7/F82: syntax + undefined names (original set).
        # F811: silent redefinitions (shadowed functions/tests).
        # F823: local variable referenced before assignment.
        # Ruff runs on 3.12 here but the package declares >=3.10, so pin
        # target-version to the floor to catch 3.12-only syntax creeping in.
        run: python -m ruff check src tests --select E9,F63,F7,F82,F811,F823 --target-version py310

      - name: Test
        run: python -m pytest
