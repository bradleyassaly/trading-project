# Polymarket trading platform — full stack orchestration.
#
# Usage:
#   docker compose up -d              # start everything
#   docker compose ps                 # status
#   docker compose logs -f scheduler  # tail one service
#   docker compose down               # stop everything
#
# The DB uses DELETE journal mode (not WAL) so bind-mount locking works
# correctly on Docker Desktop Windows. See reports/data_audit_2026-04-12.md.

services:

  # ─── Database — PostgreSQL ─────────────────────────────────────────────
  # Migrated from SQLite on 2026-04-14 after repeated corruption under
  # concurrent-writer load. Postgres's MVCC makes the whole class of
  # "database disk image is malformed" errors impossible.
  postgres:
    image: postgres:16-alpine
    container_name: polymarket-postgres
    # 2026-07-08: docker's default 64MB /dev/shm made VACUUM ANALYZE fail
    # ("could not resize shared memory segment") 10 weekly pg_prune runs in
    # a row — table bloat was accumulating silently.
    shm_size: 512mb
    environment:
      POSTGRES_USER: polymarket
      POSTGRES_PASSWORD: polymarket_dev
      POSTGRES_DB: polymarket
    ports:
      # 2026-07-07 (audit F5): bind to loopback only. Was 0.0.0.0:5432,
      # LAN-publishing the DB with the committed dev password. Host-local
      # tools still connect; other containers use the docker network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polymarket -d polymarket"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ─── Always-on services ────────────────────────────────────────────────

  api:
    build: .
    container_name: polymarket-api
    command: uvicorn trading_platform.api.main:app --host 0.0.0.0 --port 8001
    ports:
      # 2026-07-07 (audit F5): bind to loopback only. Was 0.0.0.0:8001,
      # exposing the UNauthenticated control plane (POST /api/live/clear-stop,
      # /api/system/kill-switch/reset) to every device on the LAN. --host
      # 0.0.0.0 is fine: it's the bind INSIDE the container; the published
      # mapping is what gates host/LAN reachability.
      - "127.0.0.1:8001:8001"
    volumes:
      - .:/app
    env_file: .env
    environment:
      - WALLET_DB_PATH=/app/data/polymarket/wallet_intelligence.db
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=polymarket
      - POSTGRES_PASSWORD=polymarket_dev
      - POSTGRES_DB=polymarket
      - DB_BACKEND=postgres
      # Mirror lane flags so /api/ladder/status reports them correctly.
      - LIVE_DISCOVERY_ENABLED=1
      - PHASE_B_RESOLUTION_DECAY_ENABLED=1
      # 2026-07-27 S1 slice surgery: enforce the slice gate (shadow since
      # P5; now fed by the LIVE-truth overlay) + live-lane decay band
      # 0.05-0.20 (paper keeps the full 0.05-0.40 aperture) + esports out.
      - SLICE_GATE_ENFORCE=1
      - RESOLUTION_DECAY_LIVE_ENTRY_HIGH=0.20
      - RESOLUTION_DECAY_LIVE_EXCLUDE_SUBCATS=esports
      # 2026-06-02: per-slice calibration ACTIVE. Shadow data (5 days)
      # confirmed Brier 0.58→0.18 on top signals; current calibration is
      # provably INVERTED at 0.50+ confidence band (mean conf 0.59 →
      # actual WR 25%). Wait-14-days was insurance against unknown
      # unknowns; data already proves the case. See execution audit
      # 2026-06-02 in chat log.
      - ENABLE_PER_SLICE_CALIB=1
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/api/system/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    # Now builds a static bundle via Vite and serves it with nginx
    # (see src/trading_platform/frontend/Dockerfile). Port stays 5173
    # externally for habit / bookmarks; nginx listens on 80 internally.
    # Dev workflow lives outside docker — run `npm run dev` on the host
    # and hit http://localhost:5173 as before.
    build:
      context: ./src/trading_platform/frontend
      dockerfile: Dockerfile
    container_name: polymarket-frontend
    ports:
      - "5173:80"
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      api:
        condition: service_healthy

  # ─── Scheduled tasks ───────────────────────────────────────────────────
  # The scheduler runs cron-like tasks against the trading-cli + the
  # local API. See scripts/task_scheduler.py for the schedule.
  # NOTE: the watchdog service mounts the docker socket so it can RESTART a
  # dispatch-dead scheduler (4 silent-scheduler incidents in 5 days; the
  # in-process stall self-heal cannot catch pre-main/log-dead wedges).
  scheduler:
    build: .
    container_name: polymarket-scheduler
    command: python scripts/task_scheduler.py
    volumes:
      - .:/app
      # Postgres backup volume — scripts/pg_backup.sh writes compressed
      # dumps here nightly. 7-day retention managed by the script.
      - ./backups:/backups
      # 2026-05-02: mount host's ~/.claude AND ~/.claude.json so the
      # `claude` CLI inside the container can use the host's Max
      # subscription auth headlessly. Both are needed (the CLI reads
      # config from .claude.json, plugins/cache from .claude/).
      - ${USERPROFILE:-${HOME}}/.claude:/root/.claude:ro
      - ${USERPROFILE:-${HOME}}/.claude.json:/root/.claude.json:ro
    env_file: .env
    environment:
      - WALLET_DB_PATH=/app/data/polymarket/wallet_intelligence.db
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=polymarket
      - POSTGRES_PASSWORD=polymarket_dev
      - POSTGRES_DB=polymarket
      - DB_BACKEND=postgres
      - BACKUP_DIR=/backups
      # Phase B independent signal feature flag (see live-collect block).
      # Enabled here so the scheduler task can read it.
      - PHASE_B_RESOLUTION_DECAY_ENABLED=1
      # 2026-07-27 S1 slice surgery: enforce the slice gate (shadow since
      # P5; now fed by the LIVE-truth overlay) + live-lane decay band
      # 0.05-0.20 (paper keeps the full 0.05-0.40 aperture) + esports out.
      - SLICE_GATE_ENFORCE=1
      - RESOLUTION_DECAY_LIVE_ENTRY_HIGH=0.20
      - RESOLUTION_DECAY_LIVE_EXCLUDE_SUBCATS=esports
      # 2026-06-02: per-slice calibration active for scheduled tasks.
      - ENABLE_PER_SLICE_CALIB=1
    restart: unless-stopped
    # 2026-04-18: bumped from 512m → 2g. compute-open-positions was
    # OOM-killed (exit=137) every 2h for 36+ hours; loads pandas +
    # parquet over the full open-position set. 1GB still OOMed at
    # ~19s; 2GB matches live-collect and gives headroom.
    mem_limit: 2g
    memswap_limit: 2g
    depends_on:
      api:
        condition: service_healthy

  # ─── Critical money loop (separate from the batch scheduler) ───────────
  # 2026-07-23: the money-critical loops (live_equity_snapshot,
  # live_position_monitor, maker_experiment) were EXTRACTED from the scheduler
  # after it went silently dispatch-dead 4x in 5 days — every incident took the
  # money loop down with it because it shared the scheduler's one serial loop
  # (with a ~50-min backtest). This container runs ONLY those three, each in its
  # own hard-timeout thread, so a batch-job wedge can never starve them again.
  # It OWNS the resting maker quotes (cancels on shutdown); the scheduler no
  # longer does. MAKER_EXPERIMENT_LIVE arms live quoting — comes from env_file
  # (.env). Depends on postgres only (not api) for maximum isolation.
  critical-loops:
    build: .
    container_name: polymarket-critical-loops
    command: python scripts/critical_loops.py
    volumes:
      - .:/app
    env_file: .env
    environment:
      - WALLET_DB_PATH=/app/data/polymarket/wallet_intelligence.db
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=polymarket
      - POSTGRES_PASSWORD=polymarket_dev
      - POSTGRES_DB=polymarket
      - DB_BACKEND=postgres
      - PHASE_B_RESOLUTION_DECAY_ENABLED=1
      # 2026-07-27 S1 slice surgery: enforce the slice gate (shadow since
      # P5; now fed by the LIVE-truth overlay) + live-lane decay band
      # 0.05-0.20 (paper keeps the full 0.05-0.40 aperture) + esports out.
      - SLICE_GATE_ENFORCE=1
      - RESOLUTION_DECAY_LIVE_ENTRY_HIGH=0.20
      - RESOLUTION_DECAY_LIVE_EXCLUDE_SUBCATS=esports
      - ENABLE_PER_SLICE_CALIB=1
      # Cap numeric thread pools — up to 3 subprocesses can run concurrently
      # (staggered startup), and pandas/pyarrow would otherwise each spawn a
      # CPU-count thread pool + arena. Keeps peak RSS under the 512m cap.
      - OMP_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - NUMEXPR_NUM_THREADS=2
    restart: unless-stopped
    # Money loops are light (short-lived subprocesses, no heavy parquet batch
    # jobs like the scheduler) — 512m is ample with the thread-pool caps above.
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Slow-lane analytics (heavy batch jobs, own budget) ────────────────
  # 2026-07-27: wallet_strategy_observer / wallet_behavior_metrics /
  # wallet_profiles_rebuild were dying at the scheduler's 15-min task cap
  # (observer: 9 consecutive cap-kills; metrics also OOM'd at 2 GiB), and
  # the same day a heavy job exec'd into the scheduler starved dispatch
  # until the watchdog restarted the container mid-job. Heavy analytics
  # now run HERE: sequential (one job at a time — concurrent heavy jobs
  # stacking RAM is the OOM mode), 60-min per-job timeout, 3 GiB.
  # Also runs update_exit_policy (A3 counterfactual + the per-trade
  # exit_counterfactuals table). SEQUENTIAL BY DESIGN — see slow_lane.py.
  analytics-slow:
    build: .
    container_name: polymarket-analytics-slow
    command: python scripts/slow_lane.py
    volumes:
      - .:/app
    env_file: .env
    environment:
      - WALLET_DB_PATH=/app/data/polymarket/wallet_intelligence.db
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=polymarket
      - POSTGRES_PASSWORD=polymarket_dev
      - POSTGRES_DB=polymarket
      - DB_BACKEND=postgres
      # Heavy pandas/pyarrow jobs — cap the implicit thread pools anyway;
      # the memory budget is for DATA, not thread arenas.
      - OMP_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - NUMEXPR_NUM_THREADS=4
    restart: unless-stopped
    mem_limit: 3g
    memswap_limit: 3g
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Live signal collector ─────────────────────────────────────────────
  # Long-running CLOB WebSocket collector + signal engine. Subscribes
  # to the top N markets, watches whale wallets in wallet_intelligence.db,
  # and emits wallet_alerts → polymarket_paper_trades through the
  # whale_signal_engine. Without this service, the smart-money pipeline
  # is dark — see reports/data_validation.md DV-2 and the signal-flow
  # validation report.
  live-collect:
    build: .
    container_name: polymarket-live-collect
    command: trading-cli data polymarket live-collect
    volumes:
      - .:/app
    env_file: .env
    environment:
      - WALLET_DB_PATH=/app/data/polymarket/wallet_intelligence.db
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=polymarket
      - POSTGRES_PASSWORD=polymarket_dev
      - POSTGRES_DB=polymarket
      - DB_BACKEND=postgres
      # Enable order book monitor — scans top 50 markets every 2 min
      # for bid/ask imbalances. Feeds order_flow_imbalance signals
      # into the signal engine alongside wallet-based signals.
      - POLYMARKET_ENABLE_OB_MONITOR=1
      # Cap numerical-library thread pools. Root cause of the 2026-04
      # ~130MB/h RSS climb was pyarrow+OpenBLAS each auto-spawning a
      # thread pool sized to CPU count (32 on this host → 64 extra
      # threads), and each thread getting its own jemalloc arena
      # (pyarrow bundles jemalloc). Arenas accumulated committed pages
      # over hours. Capping to 2 drops thread count ~70 → ~10 and
      # bounds the arena growth. live-collect does no heavy numerics —
      # only hourly parquet I/O for OHLCV bars — so parallelism here
      # is pure overhead.
      - OMP_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - NUMEXPR_NUM_THREADS=2
      - VECLIB_MAXIMUM_THREADS=2
      - ARROW_IO_THREADS=2
      - LIVE_COLLECT_TRACEMALLOC=0
      # 2026-04-25: enable discovery-tier live trading. With this set,
      # the kill_switch allows $1 live fires for signals at n>=1
      # resolved (vs n>=15 standard, n>=5 probation). Real-money
      # calibration data starts flowing into signal_calibration +
      # alpha_calibration_curve. Hard-capped at $1/trade so a bad
      # discovery signal can't blow up. To disable: set =0 or remove.
      - LIVE_DISCOVERY_ENABLED=1
      # 2026-04-25: Phase B independent signal. Paper-only at first;
      # decoupled from whale-flow alpha source. 15min cadence via
      # scheduler. Disable: set =0 or remove. The signal still goes
      # through the same FAV_GATE / SIDE_GATE / calibration / Kelly
      # stack, so a bad signal can't escape the existing guards.
      - PHASE_B_RESOLUTION_DECAY_ENABLED=1
      # 2026-07-27 S1 slice surgery: enforce the slice gate (shadow since
      # P5; now fed by the LIVE-truth overlay) + live-lane decay band
      # 0.05-0.20 (paper keeps the full 0.05-0.40 aperture) + esports out.
      - SLICE_GATE_ENFORCE=1
      - RESOLUTION_DECAY_LIVE_ENTRY_HIGH=0.20
      - RESOLUTION_DECAY_LIVE_EXCLUDE_SUBCATS=esports
      # 2026-06-02: per-slice calibration ACTIVE. Same rationale as api block.
      - ENABLE_PER_SLICE_CALIB=1
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    depends_on:
      api:
        condition: service_healthy

  # ─── Wallet trade poller ───────────────────────────────────────────────
  # Moved out of the scheduler queue 2026-04-15 because a single 140s
  # poll cycle (219 wallets + API round-trips) would starve other
  # scheduled tasks and trip the stale-task alert. Dedicated container
  # loops forever with an explicit inter-cycle sleep; scheduler is now
  # free to stay on-cadence for its other (fast) jobs.
  wallet-poller:
    build: .
    container_name: polymarket-wallet-poller
    # Inter-cycle sleep in seconds (600 = 10 min). Override via
    # POLLER_INTERVAL_SECONDS env if we want to tune cadence without
    # rebuilding. On transient CLI failure, sleep a short recovery
    # window and try again rather than exiting the container.
    command: >
      sh -c '
      set -e;
      while true; do
        trading-cli data polymarket poll-wallet-trades || echo "[poller] cycle failed, retrying after short backoff";
        sleep "${POLLER_INTERVAL_SECONDS:-600}";
      done'
    volumes:
      - .:/app
    env_file: .env
    environment:
      - WALLET_DB_PATH=/app/data/polymarket/wallet_intelligence.db
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=polymarket
      - POSTGRES_PASSWORD=polymarket_dev
      - POSTGRES_DB=polymarket
      - DB_BACKEND=postgres
      # 2026-07-06: 600 → 180. Detection p50 tracked the 10-min poll
      # cadence (~5 min); 3-min cadence cuts the poller-lane p50 to ~90s.
      # data-api headroom is ample (0.26% error rate at current volume).
      - POLLER_INTERVAL_SECONDS=180
      # Same thread-pool caps as live-collect — prevents pyarrow/OpenBLAS
      # from spawning 32 threads on first pandas import.
      - OMP_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - MKL_NUM_THREADS=2
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      api:
        condition: service_healthy

  # ─── Telegram command bot ─────────────────────────────────────────────
  # Long-polling bot that accepts a small command surface (/status,
  # /positions, /readiness, /funnel, /insiders, /kill, /unkill, /help)
  # and responds with live state pulled from the local API. Designed for
  # "remote control" when you're off the dashboard; all read endpoints
  # plus the emergency-stop switches. Auth via TELEGRAM_CHAT_ID.
  telegram-bot:
    build: .
    container_name: polymarket-telegram-bot
    command: python -m trading_platform.polymarket.telegram_bot
    volumes:
      - .:/app
    env_file: .env
    environment:
      - TELEGRAM_BOT_API_URL=http://api:8001
      - DB_BACKEND=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=polymarket
      - POSTGRES_PASSWORD=polymarket_dev
      - POSTGRES_DB=polymarket
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      api:
        condition: service_healthy

  # ─── Polygon WS wallet-stream ──────────────────────────────────────────
  # Real-time wallet activity tracker. Subscribes to USDC Transfer logs
  # on Polygon where one side of the transfer is the Polymarket
  # CTFExchange — any matching event for a watched wallet triggers an
  # immediate single-wallet Data API poll. ~2-5s latency vs the 10-min
  # cadence of the polymarket-wallet-poller service (kept running as a
  # safety net until WS coverage is validated).
  #
  # Requires POLYGON_WS_URL in .env — Alchemy free tier (300M CU/mo)
  # covers 200+ watched wallets indefinitely at our event volume.
  wallet-stream:
    build: .
    container_name: polymarket-wallet-stream
    command: python -m trading_platform.polymarket.wallet_stream
    volumes:
      - .:/app
    env_file: .env
    environment:
      - WALLET_DB_PATH=/app/data/polymarket/wallet_intelligence.db
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=polymarket
      - POSTGRES_PASSWORD=polymarket_dev
      - POSTGRES_DB=polymarket
      - DB_BACKEND=postgres
      - WATCHED_WALLETS_SRC=both
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      api:
        condition: service_healthy

  # ─── Health watchdog ───────────────────────────────────────────────────
  # Polls the API + scheduler every 5 minutes and fires Telegram alerts
  # on degradation / recovery. See scripts/health_watchdog.py.
  watchdog:
    build: .
    container_name: polymarket-watchdog
    command: python scripts/health_watchdog.py
    volumes:
      - .:/app
      # Docker socket: lets the watchdog RESTART a dispatch-dead scheduler
      # (auto-remediation; rate-limited in health_watchdog.py). Works on
      # Docker Desktop for Linux containers.
      - /var/run/docker.sock:/var/run/docker.sock
    env_file: .env
    environment:
      - WALLET_DB_PATH=/app/data/polymarket/wallet_intelligence.db
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=polymarket
      - POSTGRES_PASSWORD=polymarket_dev
      - POSTGRES_DB=polymarket
      - DB_BACKEND=postgres
      # External dead-man's switch. Set this in .env to a healthchecks.io
      # (or similar) ping URL with period 5m + grace ~10m. When the HOST is
      # off, these pings stop and the EXTERNAL monitor pages you — the one
      # failure mode the in-stack watchdog can't catch (see 2026-06-10→15
      # ~5.7d unattended host-off). Empty = disabled (no behaviour change).
      - HEARTBEAT_PING_URL=${HEARTBEAT_PING_URL:-}
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      api:
        condition: service_started

  # ─── DEFERRED / TODO ───────────────────────────────────────────────────
  #
  # signal-monitor: continuous whale-trade websocket loop. The
  # underlying live_collector.py exists but expects a market universe
  # to be loaded; enable once that pipeline is verified end-to-end.
  #
  # signal-monitor:
  #   build: .
  #   command: trading-cli data polymarket realtime-monitor
  #   volumes: [".:/app"]
  #   env_file: .env
  #   restart: unless-stopped
  #   depends_on: { api: { condition: service_healthy } }
  #
  # pmxt-sidecar: pmxt 2.26.x is a Python package, NOT a Node sidecar.
  # No separate container needed. The api/scheduler/watchdog containers
  # import pmxt directly.

# Postgres persistent volume
volumes:
  postgres_data:

